# The oldest versions MailPoet supports. The codeception-tests action reads this
# file for every oldest-version run: Free's nightly tests, and Premium's nightly
# runs of Free's tests with Premium active. .github/workflows/scripts/ updates the
# plugin and WordPress versions in it.
woo_core_version: 11.2.2
woo_subscriptions_version: 9.3.0
woo_memberships_version: 1.29.2
automate_woo_version: 6.8.3
wordpress_version: 7.0.4
# PHP 7.4 images; the WordPress version above is installed on them.
codeception_image_version: 7.4-cli_20220605.0
wordpress_image_version: 6.1.1-php7.4
mysql_image: mysql:5.6
mysql_command: --max_allowed_packet=100M

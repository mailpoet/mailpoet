name: 'Build MailPoet'
description: 'Install dependencies, compile the plugin and upload the result as the “mailpoet-build” artifact.'

# Used by .github/workflows/build.yml and by MailPoet Premium’s workflows.
# Premium checks out Free (from the branch with the same name, if there is
# one) and Premium in mailpoet-premium/, then runs this action from that Free
# checkout, so a Premium branch builds with its paired Free branch’s steps.

inputs:
  premium:
    description: 'Also build MailPoet Premium, checked out in mailpoet-premium/'
    default: 'false'

runs:
  using: composite
  steps:
    - name: 'Set up PHP'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: mbstring, xml, mysql, gd, zip, intl
        coverage: none
        tools: composer

    - name: 'Set up pnpm'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: 'Set up Node.js'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: 'Compute checksum for prefixer'
      shell: bash
      working-directory: mailpoet
      run: |
        # The PHP version and the versions pinned in tools/install.php select the php-scoper version
        {
          php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION, PHP_EOL;'
          cat tools/install.php
          find prefixer -type f -not -path 'prefixer/build/*' -not -path 'prefixer/vendor/*' | sort | xargs cat
        } | sha512sum | cut -d' ' -f1 > "$RUNNER_TEMP/prefixer-checksum"
        echo "PREFIXER_CHECKSUM=$(cat "$RUNNER_TEMP/prefixer-checksum")" >> "$GITHUB_ENV"

    - name: 'Cache tools'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: mailpoet/tools/vendor
        key: tools-${{ hashFiles('mailpoet/tools/install.php') }}

    - name: 'Cache Composer dependencies'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          mailpoet/vendor
          mailpoet/tasks/phpstan/vendor
          mailpoet/tasks/code_sniffer/vendor
          tests_env/vendor
        key: composer-${{ hashFiles('mailpoet/composer.lock', 'mailpoet/tasks/phpstan/composer.lock', 'mailpoet/tasks/code_sniffer/composer.lock', 'tests_env/composer.lock') }}
        restore-keys: composer-

    - name: 'Cache prefixed dependencies'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          mailpoet/prefixer/build
          mailpoet/prefixer/vendor
          mailpoet/vendor-prefixed
        key: composer-prefixed-${{ env.PREFIXER_CHECKSUM }}

    - name: 'Install and compile'
      shell: bash
      working-directory: mailpoet
      run: |
        COMPOSER_DEV_MODE=1 php tools/install.php
        ./tools/vendor/composer.phar validate --no-check-all --no-check-publish
        ./tools/vendor/composer.phar validate --no-check-all --no-check-publish --working-dir=prefixer
        touch .env
        ./do install
        # Reinstall phpstan dependencies so its post-install-cmd re-runs
        # prefix-phpstan-doctrine.php against the current prefixed Doctrine
        # version. Needed when the tasks/phpstan/vendor cache was restored
        # but the prefixer/vendor content has since changed.
        ./tools/vendor/composer.phar --working-dir=tasks/phpstan install
        ./do compile:all --env production --skip-tests
        ./do doctrine:generate-cache
        php -d register_argc_argv=1 ../tests_env/vendor/bin/codecept build
        ./do twig:generate-cache

    - name: 'Cache Premium Composer dependencies'
      if: inputs.premium == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          mailpoet-premium/tools/vendor
          mailpoet-premium/vendor
        key: premium-composer-${{ hashFiles('mailpoet-premium/tools/install.php', 'mailpoet-premium/composer.lock') }}

    - name: 'Install and compile Premium'
      if: inputs.premium == 'true'
      shell: bash
      working-directory: mailpoet-premium
      run: |
        COMPOSER_DEV_MODE=1 php tools/install.php
        echo "MAILPOET_FREE_PATH=../mailpoet" > .env
        ./tools/vendor/composer.phar validate --no-check-all --no-check-publish
        ./do install
        ./do compile:all --env production
        ./do twig:generate-cache
        php -d register_argc_argv=1 ../tests_env/vendor/bin/codecept build

    # Premium checks only its own files, like its CircleCI build.
    - name: 'Check Prettier formatting'
      shell: bash
      working-directory: ${{ inputs.premium == 'true' && 'mailpoet-premium' || 'mailpoet' }}
      run: ./do qa:prettier-check

    # Pack only what git ignores (dependencies and build output). The other
    # jobs check out the same commit and install node_modules themselves.
    # Free ignores the whole Premium checkout, so Premium’s ignored files are
    # listed from its own repository.
    - name: 'Pack build'
      shell: bash
      run: |
        git ls-files -z --others --ignored --exclude-standard --directory \
          | grep -zv -e 'node_modules/$' -e '^mailpoet-premium/$' > "$RUNNER_TEMP/build-files"
        if [[ -d mailpoet-premium ]]; then
          git -C mailpoet-premium ls-files -z --others --ignored --exclude-standard --directory \
            | grep -zv 'node_modules/$' \
            | sed -z 's|^|mailpoet-premium/|' >> "$RUNNER_TEMP/build-files"
        fi
        tar --zstd -cf "$RUNNER_TEMP/build.tar.zst" --null -T "$RUNNER_TEMP/build-files"
        ls -lh "$RUNNER_TEMP/build.tar.zst"

    - name: 'Upload build'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mailpoet-build
        path: ${{ runner.temp }}/build.tar.zst
        # Long enough for “Re-run failed jobs” on the next days
        retention-days: 7
        compression-level: 0

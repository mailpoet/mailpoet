name: 'Restore MailPoet build'
description: 'Set up PHP, unpack the files the build job made and, if asked, install JS dependencies.'

inputs:
  php-version:
    description: 'PHP version to run the job on'
    default: '8.5'
  install-js:
    description: 'Also install Node.js and the pnpm dependencies'
    default: 'false'

runs:
  using: composite
  steps:
    - name: 'Set up PHP'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, xml, mysql, gd, zip, intl
        coverage: none
        tools: composer

    - name: 'Download build'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: mailpoet-build
        path: ${{ runner.temp }}/mailpoet-build

    - name: 'Unpack build'
      shell: bash
      run: tar --zstd -xf "$RUNNER_TEMP/mailpoet-build/build.tar.zst"

    - name: 'Set up pnpm'
      if: inputs.install-js == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: 'Set up Node.js'
      if: inputs.install-js == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    # The build job already ran the root postinstall (composer install), so skip
    # scripts here. The only dependency build scripts pnpm allows are core-js's
    # postinstall messages.
    - name: 'Install JS dependencies'
      if: inputs.install-js == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

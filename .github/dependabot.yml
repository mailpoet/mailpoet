version: 2
updates:
  # SHA-pinned Actions get no Dependabot security alerts, so these weekly
  # version-update PRs are how the pins stay current. Review each bump.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # The Porter handles the PHP stubs PRs. New stubs arrive only through a lock
  # update, so Dependabot is limited to the stubs packages.
  - package-ecosystem: 'composer'
    directory: '/mailpoet/tasks/phpstan'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    allow:
      - dependency-name: 'woocommerce/php-stubs'
      - dependency-name: 'php-stubs/*'
    groups:
      php-stubs:
        patterns:
          - 'woocommerce/php-stubs'
          - 'php-stubs/*'
    ignore:
      # The sync script and the weekly workflow keep it equal to MailPoet’s
      # minimum WooCommerce version.
      - dependency-name: 'php-stubs/woocommerce-stubs'
    labels:
      - 'dependencies'

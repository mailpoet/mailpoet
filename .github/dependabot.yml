version: 2
updates:
  # SHA-pinned Actions get no Dependabot security alerts, so these weekly
  # version-update PRs are how the pins stay current. Review each bump.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - 'dependencies'

  # The Porter handles the PHP stubs PRs. New stubs arrive only through a lock
  # update, so Dependabot is limited to woocommerce/php-stubs.
  - package-ecosystem: 'composer'
    directory: '/mailpoet/tasks/phpstan'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The sync script keeps the WordPress and WooCommerce stubs at MailPoet’s
    # minimum versions.
    allow:
      - dependency-name: 'woocommerce/php-stubs'
    groups:
      php-stubs:
        patterns:
          - 'woocommerce/php-stubs'
    labels:
      - 'dependencies'

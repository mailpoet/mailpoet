name: 'Checks'

# Static analysis, linting, JS tests and PHP unit tests. Moved from the
# “build_and_test” workflow in .circleci/config.yml. Acceptance and
# integration tests and the release zip still run on CircleCI.

on:
  pull_request:
  push:
    branches:
      - trunk
      - release
  workflow_dispatch:

permissions: {}

# Run steps with pipefail, like CircleCI does.
defaults:
  run:
    shell: bash

concurrency:
  # Pull requests cancel their older runs. Each push to trunk or release
  # gets its own group, so no commit is left without checks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 'Build'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  static_analysis:
    name: 'PHPStan'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      - name: 'Static analysis'
        working-directory: mailpoet
        run: ./do qa:phpstan

  qa_php:
    name: 'PHP lint and code style (PHP ${{ matrix.php }})'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            task: qa:php
          - php: '7.4'
            task: qa:php
          # 8.1 emulates the WordPress.org environment
          - php: '8.1'
            task: qa:php-max-wporg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
        with:
          php-version: ${{ matrix.php }}
      - name: 'QA PHP'
        working-directory: mailpoet
        run: ./do ${{ matrix.task }}

  qa_js:
    name: 'JS and CSS lint'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
        with:
          install-js: 'true'
      - name: 'QA Frontend Assets'
        working-directory: mailpoet
        run: ./do qa:frontend-assets

  js_tests:
    name: 'JS tests'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mailpoet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
        with:
          install-js: 'true'
      - name: 'JS Newsletter Editor Tests'
        run: |
          mkdir -p test-results/mocha
          ./do compile:js --env production --only-tests
          ./do t:newsletter-editor test-results/mocha/newsletter_editor_junit.xml
      - name: 'JS Tests'
        run: ./do t:j test-results/mocha/junit.xml
      - name: 'Upload test results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-test-results
          path: mailpoet/test-results/mocha
          retention-days: 14

  unit_tests:
    name: 'PHP unit tests'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mailpoet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      # Unit tests load some WordPress files (PHPMailer) but need no database.
      - name: 'Download WordPress'
        working-directory: .
        run: curl -sSfL https://wordpress.org/latest.tar.gz | tar -xz
      - name: 'PHP Unit tests'
        env:
          WP_ROOT: ${{ github.workspace }}/wordpress
        run: ./do t:u --xml
      - name: 'Upload test results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: mailpoet/tests/_output
          retention-days: 14

  security_analysis:
    name: 'Semgrep'
    # Pull requests from forks get no secrets, so there is no key to clone the
    # rules with. Everywhere else a missing key must fail the job.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SEMGREP_RULES_DEPLOY_KEY }}
      # Same as `./do qa:semgrep`, without waiting for the build it doesn’t need.
      - name: 'QA Security'
        working-directory: mailpoet
        run: ./tools/semgrep.sh lib/ lib-3rd-party/

  notify:
    name: 'Notify Slack on failure'
    needs:
      - build
      - static_analysis
      - qa_php
      - qa_js
      - js_tests
      - unit_tests
      - security_analysis
    if: ${{ failure() && github.event_name == 'push' }}
    uses: ./.github/workflows/notify-slack.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

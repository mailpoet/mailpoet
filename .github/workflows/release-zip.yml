name: 'Release zip'

# Builds the release zip, with lang/mailpoet.pot, from the build artifact of the
# calling run, and lints it on PHP 7.4. The release tooling
# (mailpoet/tasks/release/GitHubActionsController.php) downloads the mailpoet-zip
# artifact from a successful checks.yml run on the release branch.

on:
  workflow_call:
    inputs:
      retention-days:
        description: 'Days to keep the mailpoet-zip artifact'
        type: number
        default: 7

permissions: {}

# Run steps with pipefail, like CircleCI does.
defaults:
  run:
    shell: bash

jobs:
  zip:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      # build.sh runs pnpm install itself
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: 'Set up WordPress'
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -sSfLo "$RUNNER_TEMP/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$RUNNER_TEMP/wp" && sudo mv "$RUNNER_TEMP/wp" /usr/local/bin/wp
          wp core download --path=wordpress
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --dbprefix=mp_ --path=wordpress
          wp core install --admin_name=admin --admin_password=admin --admin_email=admin@example.com \
            --url=http://localhost --title=WordPress --path=wordpress --skip-email
          echo "WP_ROOT=${{ github.workspace }}/wordpress" >> mailpoet/.env
      - name: 'Build'
        working-directory: mailpoet
        run: ./build.sh
      - name: 'Upload release zip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailpoet-zip
          path: |
            mailpoet/mailpoet.zip
            mailpoet/lang/mailpoet.pot
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  lint_php74:
    name: 'Lint on PHP 7.4'
    needs: zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailpoet-zip
          path: ${{ runner.temp }}/zip
      - name: 'Lint the release zip on PHP 7.4'
        run: .circleci/lint-release-zip.sh "$RUNNER_TEMP/zip/mailpoet.zip" .circleci/php74-lint-exclude.txt

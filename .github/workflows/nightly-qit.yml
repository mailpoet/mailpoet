name: 'Nightly QIT'

# Builds the release zip and runs the QIT checks on it. Moved from the
# "nightly_qit" workflow in .circleci/config.yml.

on:
  schedule:
    # Every Tuesday and Wednesday at 4am UTC. CircleCI’s nightly_qit runs at
    # 2am, so the two don’t share the QIT account at the same time.
    - cron: '0 4 * * 2,3'
  workflow_dispatch:

permissions: {}

# Run steps with pipefail, like CircleCI does.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: 'Build'
    if: github.repository_owner == 'mailpoet'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release_zip:
    name: 'Build release zip'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
        with:
          install-js: 'true'
      - name: 'Set up WordPress'
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          curl -sSfLo "$RUNNER_TEMP/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$RUNNER_TEMP/wp" && sudo mv "$RUNNER_TEMP/wp" /usr/local/bin/wp
          wp core download --path=wordpress
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --dbprefix=mp_ --path=wordpress
          wp core install --admin_name=admin --admin_password=admin --admin_email=admin@example.com \
            --url=http://localhost --title=WordPress --path=wordpress --skip-email
          echo "WP_ROOT=${{ github.workspace }}/wordpress" >> mailpoet/.env
      - name: 'Build'
        working-directory: mailpoet
        run: ./build.sh
      - name: 'Upload release zip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mailpoet-zip
          path: |
            mailpoet/mailpoet.zip
            mailpoet/lang/mailpoet.pot
          retention-days: 7

  lint_release_zip_php74:
    name: 'Lint release zip on PHP 7.4'
    needs: release_zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailpoet-zip
          path: ${{ runner.temp }}/zip
      - name: 'Lint the release zip on PHP 7.4'
        run: .circleci/lint-release-zip.sh "$RUNNER_TEMP/zip/mailpoet.zip" .circleci/php74-lint-exclude.txt

  qit:
    name: 'QIT ${{ matrix.name }}'
    needs: release_zip
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Woo E2E usually takes about 45 minutes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security
            task: qa:qit-security
          - name: malware
            task: qa:qit-malware
          - name: php-compatibility
            task: qa:qit-php-compatibility
          - name: activation
            task: qa:qit-activation --wc=rc
          - name: woo-api
            task: qa:qit-woo-api --wc=rc
          - name: woo-e2e
            task: qa:qit-woo-e2e --wc=rc
    defaults:
      run:
        working-directory: mailpoet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailpoet-zip
          path: mailpoet
      - name: 'Authenticate in QIT'
        env:
          QIT_PARTNER_USER: ${{ secrets.QIT_PARTNER_USER }}
          QIT_TOKEN: ${{ secrets.QIT_TOKEN }}
        run: ./vendor/bin/qit partner:add --user="$QIT_PARTNER_USER" --qit_token="$QIT_TOKEN"
      - name: 'Run QIT ${{ matrix.name }}'
        run: |
          mkdir -p tests/_output
          ./do ${{ matrix.task }} | tee tests/_output/qit-${{ matrix.name }}
      - name: 'Retrieve test results'
        if: ${{ !cancelled() }}
        run: grep "Result Url" tests/_output/qit-${{ matrix.name }} | awk '{ print $3 }' | xargs curl -sSfo tests/_output/report.html
      - name: 'Upload results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qit-${{ matrix.name }}
          path: mailpoet/tests/_output
          retention-days: 14

  notify:
    name: 'Notify Slack on failure'
    needs: [build, release_zip, lint_release_zip_php74, qit]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify-slack.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

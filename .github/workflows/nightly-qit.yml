name: 'Nightly QIT'

# Builds the release zip and runs the QIT checks on it.

on:
  schedule:
    - cron: '0 2 * * 2,3' # Every Tuesday and Wednesday at 2am UTC
  workflow_dispatch:

permissions: {}

# Run steps with pipefail.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: 'Build'
    if: github.repository_owner == 'mailpoet'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release_zip:
    name: 'Release zip'
    needs: build
    uses: ./.github/workflows/release-zip.yml
    permissions:
      contents: read

  qit:
    name: 'QIT ${{ matrix.name }}'
    needs: release_zip
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Woo E2E usually takes about 45 minutes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security
            task: qa:qit-security
          - name: malware
            task: qa:qit-malware
          - name: php-compatibility
            task: qa:qit-php-compatibility
          - name: activation
            task: qa:qit-activation --wc=rc
          - name: woo-api
            task: qa:qit-woo-api --wc=rc
          - name: woo-e2e
            task: qa:qit-woo-e2e --wc=rc
    defaults:
      run:
        # Job defaults replace the workflow ones, so set the shell again
        shell: bash
        working-directory: mailpoet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mailpoet-zip
          path: mailpoet
      - name: 'Authenticate in QIT'
        env:
          QIT_PARTNER_USER: ${{ secrets.QIT_PARTNER_USER }}
          QIT_TOKEN: ${{ secrets.QIT_TOKEN }}
        run: ./vendor/bin/qit partner:add --user="$QIT_PARTNER_USER" --qit_token="$QIT_TOKEN"
      - name: 'Run QIT ${{ matrix.name }}'
        run: |
          mkdir -p tests/_output
          ./do ${{ matrix.task }} | tee tests/_output/qit-${{ matrix.name }}
      - name: 'Retrieve test results'
        if: ${{ !cancelled() }}
        run: grep "Result Url" tests/_output/qit-${{ matrix.name }} | awk '{ print $3 }' | xargs curl -sSfo tests/_output/report.html
      - name: 'Upload results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qit-${{ matrix.name }}
          path: mailpoet/tests/_output
          retention-days: 14

  notify:
    name: 'Notify Slack on failure'
    needs: [build, release_zip, qit]
    # Alert only for trunk, not for manual runs on other branches.
    if: ${{ failure() && (github.event_name == 'schedule' || github.ref_name == 'trunk') }}
    uses: ./.github/workflows/notify-slack.yml
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

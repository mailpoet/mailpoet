name: 'Build'

# Installs dependencies and compiles the free plugin once, then hands the
# result to the jobs that need it as the “mailpoet-build” artifact. Mirrors the
# “build” job in .circleci/config.yml. The steps live in
# .github/actions/build.

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build

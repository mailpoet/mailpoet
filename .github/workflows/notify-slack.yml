name: 'Notify Slack'

# Posts a failed run to #mailpoet-dev-feeds, like the slack/notify post-step
# in .circleci/config.yml. Callers decide when to call it.

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  notify:
    name: 'Notify Slack'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Post to #mailpoet-dev-feeds'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: mailpoet-dev-feeds
            text: "GitHub Actions run failed: ${{ github.workflow }} on ${{ github.ref_name }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "Workflow Failed :red_circle:"
                  emoji: true
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Workflow*: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
                  - type: mrkdwn
                    text: "*Project*: ${{ github.event.repository.name }}"
                  - type: mrkdwn
                    text: "*Branch*: ${{ github.ref_name }}"
                  - type: mrkdwn
                    text: "*Author*: ${{ github.actor }}"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: "View Run"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: 'Dependabot PHP stubs auto-merge'

# The weekly php-stubs group bumps only woocommerce/php-stubs, which only
# PHPStan reads. Its PR merges once the required checks pass. Other Dependabot
# PRs wait for a person.
on:
  pull_request:

permissions: {}

jobs:
  auto_merge:
    name: 'Queue the merge'
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Read Dependabot metadata'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: 'Enable auto-merge'
        if: ${{ steps.metadata.outputs.dependency-group == 'php-stubs' }}
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
